
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  authUsers {
    string id PK
    string fullName
    string nickname
    string email
    string provider
    string profileId FK
  }
  users {
    string id PK
    string authUserId FK
    string name
    string nickname
    string friendCode
    number xp
    number level
    number streakDays
    map stats
    map privacy
    map notifications
    map categories
  }
  plants {
    string id PK
    string userId FK
    string categoryId FK
    string name
    string nickname
    string scientificName
    number healthStatus
    number progress
    number careFrequencyPerWeek
    string lastWatered
  }
  achievementTemplates {
    string id PK
    string title
    string category
    array tiers
  }
  achievements {
    string id PK
    string userId FK
    string templateId FK
    string tier
    number progress
    number goal
    boolean unlocked
  }
  careSchedule {
    string id PK
    string plantId FK
    string userId FK
    string type
    string status
    timestamp scheduledFor
  }
  careHistory {
    string id PK
    string plantId FK
    string userId FK
    string scheduleId FK
    string type
    string completedAt
  }
  friendships {
    string id PK
    array participants
  }
  friendRequests {
    string id PK
    string fromUserId FK
    string toUserId FK
    string status
    string toCode
  }
  levelConfig {
    string id PK
    number level
    string title
    number xpRequired
    number xpMax
  }
  notifications {
    string id PK
    string userId FK
    string type
    boolean read
  }
  plantIssues {
    string id PK
    string plantId FK
    string userId FK
    string type
    string severity
    string status
  }
  plantTags {
    string id PK
    string plantId FK
    string userId FK
    string value
  }

  authUsers ||--|| users : "profileId"
  users ||--o{ plants : "userId"
  users ||--o{ achievements : "userId"
  users ||--o{ careSchedule : "userId"
  users ||--o{ careHistory : "userId"
  users ||--o{ notifications : "userId"
  plants ||--o{ careSchedule : "plantId"
  plants ||--o{ careHistory : "plantId"
  plants ||--o{ plantIssues : "plantId"
  plants ||--o{ plantTags : "plantId"
  achievementTemplates ||--o{ achievements : "templateId"
  careSchedule ||--o{ careHistory : "scheduleId"
  levelConfig ||--o{ users : "level"
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
